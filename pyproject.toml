[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiexport"
version = "0.1.0"
description = "Turn SVG / HTML / PDF designs into Illustrator-compatible .ai files (CMYK, outlined text, bleed) — CLI + MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "pypdfium2>=4.20",
]

[project.optional-dependencies]
# SVG renderer that needs no external program (requires the cairo C library).
cairo = ["cairosvg>=2.7"]
# HTML input (and SVG fallback) through a headless Chromium / Chrome / Edge.
html = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
aiexport = "aiexport.cli:main"
aiexport-mcp = "aiexport.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiexport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
