<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 让 LibreOffice 用与宋体字宽一致的 UMing Song XL 渲染“宋体/SimSun” -->
<fontconfig>
  <alias binding="same"><family>宋体</family><prefer><family>UMing Song XL</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>UMing Song XL</family></prefer></alias>
</fontconfig>
