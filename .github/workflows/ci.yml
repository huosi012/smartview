name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]   # 3.10 = JetPack 6 系统 Python
    env:
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,onnx]"
      - name: Lint
        run: ruff check .
      - name: Unit & integration tests
        run: pytest -q
      - name: Replay smoke test
        run: python -m smartview replay -c configs/replay_synthetic.yaml --max-frames 60 --no-hmi
