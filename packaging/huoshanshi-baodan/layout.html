<style>
  :root { --green:#0B5D3B; --gold:#C9A24D; --ivory:#FAF7EF; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e8ebe8; font-family:'Noto Sans SC', sans-serif; color:#1d2a24; }
  header { padding:20px 24px 0; text-align:center; }
  header h1 { margin:0 0 6px; font-size:20px; font-family:'Noto Serif SC', serif; font-weight:900; color:var(--green); }
  header p { margin:0; font-size:13px; color:#5b6b63; }
  .bar { display:flex; gap:8px; justify-content:center; padding:14px 16px 0; flex-wrap:wrap; }
  .bar button { font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid #b9a36a; background:#fff; color:#4a3d1c; cursor:pointer; }
  .bar button[aria-pressed="true"] { background:var(--green); color:#fff; border-color:var(--green); }
  .wrap { display:flex; flex-wrap:wrap; gap:28px; padding:20px 16px 36px; justify-content:center; }
  figure { margin:0; max-width:100%; }
  figcaption { font-size:13px; color:#5b6b63; margin-top:8px; text-align:center; }
  svg.panel { width:500px; max-width:100%; height:auto; display:block; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.16); }
  .annot, .win { display:none; }
  body.m-annot .annot { display:inline; }
  body.m-window .win { display:inline; }
  body.m-window .nowin { display:none; }
  body.m-render header, body.m-render .bar { display:none; }
  body.m-render .wrap { padding:0; gap:0; }
  body.m-render svg.panel { width:1560px; box-shadow:none; }
  body.m-render figcaption { display:none; }
</style>

<script>
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

function ball(g, cx, cy, r, shadow) {
  if (shadow) el('ellipse', { cx, cy: cy + r * .9, rx: r * .86, ry: r * .2, fill: '#000', 'fill-opacity': .5, filter: 'url(#fBlur1)' }, g);
  el('circle', { cx, cy, r, fill: 'url(#gBall)', filter: 'url(#fFry)' }, g);
  el('circle', { cx, cy, r: r - .3, fill: 'none', stroke: '#8A5520', 'stroke-opacity': .35, 'stroke-width': .6 }, g);
  const hx = cx - r * .36, hy = cy - r * .42;
  el('ellipse', { cx: hx, cy: hy, rx: r * .3, ry: r * .16, fill: '#fff', 'fill-opacity': .42, transform: `rotate(-32 ${hx} ${hy})`, filter: 'url(#fBlur1)' }, g);
}
function leaf(g, x, y, rot, s) {
  const t = el('g', { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})` }, g);
  el('path', { d: 'M0,0 C7,-9 24,-11 37,-3 C24,3 9,5 0,0 Z', fill: 'url(#gLeaf)' }, t);
  el('path', { d: 'M1.5,-.3 C12,-3.4 25,-4.2 35.5,-3', fill: 'none', stroke: '#C6ECCC', 'stroke-width': .45, 'stroke-opacity': .75 }, t);
}

function buildHero() {
  const g = document.getElementById('slabBalls');
  // 火山石板
  el('ellipse', { cx: 140, cy: 297, rx: 102, ry: 8, fill: '#000', 'fill-opacity': .22, filter: 'url(#fBlur2)' }, g);
  el('ellipse', { cx: 140, cy: 287.5, rx: 97, ry: 20.5, fill: '#171513' }, g);
  el('ellipse', { cx: 140, cy: 282, rx: 97, ry: 20, fill: 'url(#gStone)', filter: 'url(#fStone)' }, g);
  const pores = el('g', { 'clip-path': 'url(#cStone)' }, g);
  const R = rng(42);
  for (let i = 0; i < 360; i++) {
    const a = R() * Math.PI * 2, d = Math.sqrt(R());
    const x = 140 + Math.cos(a) * d * 96, y = 282 + Math.sin(a) * d * 19.5;
    const r = .22 + Math.pow(R(), 2.2) * 1.4;
    el('circle', { cx: x + r * .25, cy: y + r * .3, r: r * .95, fill: '#7A736C', 'fill-opacity': .38 }, pores);
    el('circle', { cx: x, cy: y, r, fill: '#0D0C0B', 'fill-opacity': .82 }, pores);
  }
  el('ellipse', { cx: 140, cy: 282, rx: 96.5, ry: 19.5, fill: 'none', stroke: '#8A827A', 'stroke-opacity': .35, 'stroke-width': .5 }, g);
  // 叶子（在前排球后面）
  const lp = document.getElementById('leafPair');
  leaf(lp, 212, 249, -30, 1);
  leaf(lp, 218, 259, 6, .82);
  el('use', { href: '#leafPair' }, g);
  leaf(g, 66, 290, 200, .55);
  // 后排
  ball(g, 113, 243, 24.5, true);
  ball(g, 168, 244, 24.5, true);
  // 前排
  ball(g, 86, 268, 26.5, true);
  ball(g, 194, 268, 26, true);
  ball(g, 140, 273, 28.5, true);

  // 切面球
  const c = document.getElementById('cutBall');
  el('ellipse', { cx: 142, cy: 238, rx: 22, ry: 4, fill: '#3B2410', 'fill-opacity': .35, filter: 'url(#fBlur1)' }, c);
  ball(c, 142, 213, 27, false);
  el('ellipse', { cx: 141, cy: 211, rx: 23, ry: 21, fill: 'url(#gFlesh)', stroke: '#D49E4A', 'stroke-width': 1.1, transform: 'rotate(-12 141 211)' }, c);
  const blob = (cx, cy, rx, ry, seed) => {
    const Rb = rng(seed); const ph = [Rb() * 6, Rb() * 6, Rb() * 6]; let d = '';
    for (let i = 0; i <= 48; i++) {
      const a = i / 48 * Math.PI * 2;
      const k = 1 + .04 * Math.sin(4 * a + ph[0]) + .025 * Math.sin(7 * a + ph[1]) + .015 * Math.sin(11 * a + ph[2]);
      d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rx * k).toFixed(2) + ',' + (cy + Math.sin(a) * ry * k).toFixed(2);
    }
    return d + 'Z';
  };
  el('path', { d: blob(141.5, 211.8, 15.8, 14.2, 5), fill: '#B9772E', 'fill-opacity': .4, transform: 'rotate(-12 141.5 211.8)' }, c);
  el('path', { d: blob(141.2, 211.2, 14.4, 12.8, 9), fill: 'url(#gMeat)', filter: 'url(#fMeat)', transform: 'rotate(-12 141.2 211.2)' }, c);
  el('path', { d: blob(142.6, 214.2, 11, 6.8, 3), fill: '#D9902F', 'fill-opacity': .45, transform: 'rotate(-12 142.6 214.2)' }, c);
  el('path', { d: 'M146.5,221 C148.6,224.5 149.8,228.4 149.9,231.6 C150,234.6 147,235.2 146.4,232.4 C145.9,229.4 145.6,225.4 144.8,221.6 Z', fill: '#C27A2B', 'fill-opacity': .9 }, c);

function tag(layer, x, y, text, color, anchor) {
  const t = el('text', { x: x + 2, y: y + 3.7, 'font-size': 3.3, 'font-weight': 700, fill: color }, null, text);
  layer.appendChild(t);
  const w = t.getComputedTextLength() + 4;
  const bx = anchor === 'end' ? x - w : x;
  t.setAttribute('x', bx + 2);
  const r = el('rect', { x: bx, y, width: w, height: 5.2, rx: 1.2, fill: '#FFFFFF', 'fill-opacity': .94, stroke: color, 'stroke-width': .35 }, null);
  layer.insertBefore(r, t);
}

const modes = ['annot', 'window', 'render'];
function applyHash() {
  const parts = location.hash.replace('#', '').split(',');
  modes.forEach(m => document.body.classList.toggle('m-' + m, parts.includes(m)));
  const cur = parts.find(p => p === 'annot' || p === 'window') || '';
  document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === cur)));
}
document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => {
  ['annot', 'window'].forEach(m => document.body.classList.remove('m-' + m));
  if (b.dataset.mode) document.body.classList.add('m-' + b.dataset.mode);
  document.querySelectorAll('.bar button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
window.addEventListener('hashchange', applyHash);
applyHash();
document.fonts.ready.then(() => {
  buildHero();
  buildBack();
  // 标注层需要测量文字宽度，临时显示后再按模式隐藏
  const was = document.body.classList.contains('m-annot');
  document.body.classList.add('m-annot');
  buildAnnot();
  if (!was) document.body.classList.remove('m-annot');
  window.__ready = true;
});
